<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Nuevo producto</title>
    <link rel="stylesheet" href="../assets/style-admin.css">
</head>
<body>
    <div class="admin-body">

        <aside class="admin-sidebar">
            <div class="admin-logo">Zthorken Admin</div>
            <ul class="admin-nav">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="productos.html" class="activo">Productos</a></li>
                <li><a href="usuarios.html">Usuarios</a></li>
            </ul>
            <div class="admin-sidebar-footer">
                <a href="../index.html">Volver a la tienda</a>
                <a href="../login.html">Cerrar sesión</a>
            </div>
        </aside>

        <div class="admin-main">
            <header class="admin-topbar">
                <h1>Nuevo producto</h1>
            </header>

            <main class="admin-content">
                <form class="admin-formulario">
                    <div class="campo">
                        <label for="codigo">Código producto</label>
                        <input type="text" id="codigo" name="codigo" placeholder="Ej: P005">
                    </div>

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Nombre del producto">
                    </div>

                    <div class="campo">
                        <label for="descripcion">Descripción (opcional)</label>
                        <textarea id="descripcion" name="descripcion" rows="4" placeholder="Descripción del producto"></textarea>
                    </div>

                    <div class="fila-doble">
                        <div class="campo">
                            <label for="precio">Precio</label>
                            <input type="number" id="precio" name="precio" min="0" step="0.01" placeholder="0">
                        </div>
                        <div class="campo">
                            <label for="stock">Stock</label>
                            <input type="number" id="stock" name="stock" min="0" step="1" placeholder="0">
                        </div>
                    </div>

                    <div class="fila-doble">
                        <div class="campo">
                            <label for="stock-critico">Stock crítico (opcional)</label>
                            <input type="number" id="stock-critico" name="stock-critico" min="0" step="1" placeholder="0">
                        </div>
                        <div class="campo">
                            <label for="categoria">Categoría</label>
                            <select id="categoria" name="categoria">
                                <option value="">-- Seleccione una categoría --</option>
                                <option value="audio">Audio</option>
                                <option value="tecnologia">Tecnología</option>
                                <option value="accesorios">Accesorios Tech</option>
                            </select>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="imagen">Imagen (opcional)</label>
                        <input type="file" id="imagen" name="imagen">
                    </div>

                    <div class="acciones-form">
                        <button type="submit" class="btn-gold">Guardar producto</button>
                        <a href="productos.html" class="btn-outline">Cancelar</a>
                    </div>
                </form>
            </main>
        </div>

    </div>

    <script src="../assets/toast.js"></script>
    <script src="../assets/admin-productos.js"></script>
</body>
</html>
