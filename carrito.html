<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style-carrito.css">
    <title>Carrito</title>
</head>
<body>

    <nav class="navbar">
    <div class="navdiv">

        <div class="logo"><a href="#">Zthorken Online</a></div>

        <ul>
            <li><a href="#productos">Productos</a></li>
            <li><a href="#">Home</a></li>
            <li><a href="#">Nosotros</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">Contactos</a></li>
        </ul>

        <button>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16">
                <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0-4"/>
            </svg>
            <a href="#">Carrito</a>
        </button>

    </div>
</nav>

<main class="carrito-page">
    <h1>Tu carrito</h1>

    <div class="carrito-layout">
        <div id="carrito-items" class="carrito-items"></div>

        <aside class="carrito-resumen">
            <h2>Resumen</h2>
            <div class="carrito-resumen-linea">
                <span>Total</span>
                <span id="carrito-total">$0</span>
            </div>
            <button class="btn-pagar">Ir a pagar</button>
        </aside>
    </div>
</main>

<script src="assets/productos-data.js"></script>
<script src="assets/carrito.js"></script>
</body>
</html>
