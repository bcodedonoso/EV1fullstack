<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style-contacto.css">
</head>
<body>

    <nav class="navbar">
    <div class="navdiv">

        <div class="logo"><a href="#">Zthorken Online</a></div>

        <ul>
            <li><a href="#productos">Productos</a></li>
            <li><a href="#">Home</a></li>
            <li><a href="#">Nosotros</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">Contactos</a></li>
        </ul>

        <button>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16">
                <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0-4"/>
            </svg>
            <a href="#">Carrito</a>
        </button>

    </div>
</nav>


    <main>
        <div class="formulario">
            <p class="formulario-titulo">Formulario de contacto</p>
          <form id="formularioContacto" class="card-formulario">

            <div class="campo">
                <label for="nombre" class="formulario-label">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required />
            </div>

            <div class="campo">
                <label for="correo" class="formulario-label">Correo</label>
                <input type="email" id="correo" name="correo" placeholder="nombre@correo.com" required />
            </div>

            <div class="campo">
                <label for="contenido" class="formulario-label">Contenido</label>
                <textarea id="contenido" name="contenido" rows="5" placeholder="Escribe tu mensaje" required></textarea>
            </div>

            <button type="submit">Enviar mensaje</button>

          </form>
        </div>
    </main>



    
<footer class="footer">
    <div class="footer-content">

        <div class="footer-left">
            <div class="footer-site-name">Zthorken Online</div>
            <ul class="footer-categories">
                <li><a href="#">Audio</a></li>
                <li><a href="#">Tecnología</a></li>
                <li><a href="#">Accesorios Tech</a></li>
            </ul>
        </div>

        <div class="footer-right">
            <p class="newsletter-text">¡Mantente en contacto! Únete a nuestro newsletter.</p>
            <form class="newsletter-form">
                <input type="email" placeholder="Ingresa tu correo" aria-label="Correo electrónico" required>
                <button type="submit">Suscribirse</button>
            </form>
        </div>

    </div>

    <div class="footer-bottom">
        <p>&copy; 2026 Zthorken Online. Todos los derechos reservados.</p>
    </div>
</footer>

</body>
</html>
