<!DOCTYPE html>
<html lang="es">    


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ZTHORKEN</title>
    <link rel="stylesheet" href="assets/style-login.css">
    
</head>
<body>

<nav class="navbar">
    <div class="navdiv">

        <div class="logo"><a href="#">Zthorken Online</a></div>

        <ul>
            <li><a href="#productos">Productos</a></li>
            <li><a href="#">Home</a></li>
            <li><a href="#">Nosotros</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">Contactos</a></li>
        </ul>

        <button>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16">
                <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0-4"/>
            </svg>
            <a href="#">Carrito</a>
        </button>

    </div>
</nav>




<main class="login-page">
    <div class="company-branding">
        <img src="img/logo.png" alt="Logo de la empresa">
        <h2>Bienvenido a ZTHORKEN</h2>
    </div>

    <!-- Formulario de inicio de sesion -->
    <section class="form-container">
        <div class="form-header">
            <h3>Iniciar Sesión</h3>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
            </div>

            <div class="input-group">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>
            </div>

            <div class="submit-group">
                <button type="submit" id="btn-login">Iniciar Sesión</button>
            </div>
        </form>
    </section>
</main>

<!-- footer -->

<footer class="footer">
    <div class="footer-content">

        <div class="footer-left">
            <div class="footer-site-name">Zthorken Online</div>
            <ul class="footer-categories">
                <li><a href="#">Audio</a></li>
                <li><a href="#">Tecnología</a></li>
                <li><a href="#">Accesorios Tech</a></li>
            </ul>
        </div>

        <div class="footer-right">
            <p class="newsletter-text">¡Mantente en contacto! Únete a nuestro newsletter.</p>
            <form class="newsletter-form">
                <input type="email" placeholder="Ingresa tu correo" aria-label="Correo electrónico" required>
                <button type="submit">Suscribirse</button>
            </form>
        </div>
    </div>

    
    <div class="footer-bottom">
        <p>&copy; 2026 Zthorken Online. Todos los derechos reservados.</p>
    </div>


</footer>
</body>
</html>
