<main class="login-page">
    <div class="company-branding">
        <h2>Bienvenido a ZTHORKEN</h2>
    </div>

    <!-- Formulario de inicio de sesion -->
    <section class="form-container">
        <div class="form-header">
            <h3>Iniciar Sesión</h3>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
            </div>

            <div class="input-group">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>
            </div>

            <div class="submit-group">
                <button type="submit" id="btn-login">Iniciar Sesión</button>
            </div>
        </form>
    </section>
</main>

<script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const correo = document.getElementById('correo').value.trim();
        const contrasena = document.getElementById('contrasena').value;

        // Credenciales de administrador (solo para efectos de este proyecto,
        // en un sitio real esto se valida en un servidor, no en el navegador)
        const ADMIN_CORREO = 'admin@zthorken.cl';
        const ADMIN_CONTRASENA = 'admin123';

        if (correo === ADMIN_CORREO && contrasena === ADMIN_CONTRASENA) {
            window.location.href = '/admin/index.html';
        } else {
            alert('Correo o contraseña incorrectos.');
        }
    });
</script>
