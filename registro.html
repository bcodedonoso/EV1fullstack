    <main>
        <div class="formulario">
            <p class="formulario-titulo">Registro de usuario</p>
          <form id="formularioContacto" class="card-formulario">

            <div class="campo">
                <label for="nombre" class="formulario-label">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required />
            </div>

            <div class="campo">
                <label for="email" class="formulario-label">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="nombre@correo.com" required />
            </div>

            <div class="campo">
                <label for="email-confirmar" class="formulario-label">Confirma correo electrónico</label>
                <input type="email" id="email-confirmar" name="email-confirmar" placeholder="nombre@correo.com" required />
            </div>

            <div class="campo">
                <label for="contraseña" class="formulario-label">contraseña </label>
                <input type="password" id="contraseña" name="contraseña" placeholder="********" />
            </div>
            <div class="campo">
                <label for="contraseña-confirmar" class="formulario-label">contraseña (confirmar) </label>
                <input type="password" id="contraseña-confirmar" name="contraseña-confirmar" placeholder="********" />
            </div>

            <div class="campo">
                <label for="telefono" class="formulario-label">Teléfono (opcional)</label>
                <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678" />
            </div>

            <div class="campo">
                <label for="region" class="formulario-label">Región</label>
                <select id="region" name="region" required>
                    <option value="">-- Seleccione la región --</option>
                    <option value="rm">Región Metropolitana de Santiago</option>
                    <option value="araucania">Región de la Araucanía</option>
                    <option value="nuble">Región de Ñuble</option>
                </select>
            </div>

            <div class="campo">
                <label for="comuna" class="formulario-label">Comuna</label>
                <select id="comuna" name="comuna" required disabled>
                    <option value="">-- Seleccione la comuna --</option>
                </select>
            </div>

            <button type="submit">Registrarse</button>

          </form>
        </div>
    </main>
